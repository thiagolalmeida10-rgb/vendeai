name: CI Frontend

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test-and-build:
        runs-on: ubuntu-latest

        defaults: 
            run:
                working-directory: frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: build
              run: npm run build

    backend:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                node-version: 22
            
            - name: Check backend files
              run: |
                echo "PACKAGE.JSON"
                grep '"typescript"' backend/package.json
      
                echo "LOCKFILE"
                grep -A2 '"node_modules/typescript"' backend/package-lock.json

            - name: Install backend dependencies
              working-directory: backend
              run: npm ci

            - name: Run backend tests
              working-directory: backend
              run: npm test

            - name: Build backend
              working-directory: backend
              run: npm run build